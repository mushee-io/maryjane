name: Mary Jane Market Account Probe

on:
  push:
    branches: [main]
    paths:
      - "api/market-probe.ts"
      - "vercel.json"
      - "scripts/market-account-probe.mjs"
      - ".github/workflows/market-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify created Devnet market account
        run: node scripts/market-account-probe.mjs

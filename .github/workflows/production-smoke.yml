name: Mary Jane Production Discovery

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "src/**"
      - "vercel.json"
      - "package.json"
      - "scripts/production-discovery-smoke.mjs"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:

jobs:
  production-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for production and verify native market
        run: node scripts/production-discovery-smoke.mjs
